name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ZIP entpacken
        run: |
          ZIP=$(ls *.zip | head -n 1)
          echo "Entpacke: $ZIP"
          unzip -q -o "$ZIP" -d build_src
          ls build_src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: APK bauen
        working-directory: build_src/MadeAt545
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MadeAt545-apk
          path: build_src/MadeAt545/app/build/outputs/apk/debug/app-debug.apk
