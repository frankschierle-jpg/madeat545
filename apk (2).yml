name: APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Neueste ZIP entpacken
        run: |
          ZIP=$(for f in *.zip; do echo "$(git log -1 --format=%ct -- "$f") $f"; done | sort -n | tail -n 1 | cut -d' ' -f2-)
          echo "Benutze die zuletzt hochgeladene ZIP: $ZIP"
          unzip -q -o "$ZIP" -d build_src
          grep versionName build_src/MadeAt545/app/build.gradle.kts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: APK bauen
        working-directory: build_src/MadeAt545
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MadeAt545-apk
          path: build_src/MadeAt545/app/build/outputs/apk/debug/app-debug.apk
